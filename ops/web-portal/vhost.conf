server {
    listen 80;
    server_name eaglesistemas.com www.eaglesistemas.com suporte.eaglesistemas.com;
    root /usr/share/nginx/html/eaglesistemas;
    index index.html;

    location = /pbx {
        return 301 /pbx/;
    }

    location ^~ /pbx/ {
        auth_basic "Eagle PBX - Área restrita";
        auth_basic_user_file /etc/nginx/auth/eagle-pbx.htpasswd;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}

