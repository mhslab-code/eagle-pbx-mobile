# Página de manutenção Eagle - CA
# Usada quando o NPM apontar forms.eaglesistemas.com para 10.20.20.116:8081
server {
    listen 80;
    server_name forms.eaglesistemas.com;

    root /usr/share/nginx/html/eagle-manutencao;
    index index.html;

    add_header Retry-After "300" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;

    charset utf-8;

    location = /logo.png {
        try_files /logo.png =404;
    }

    location = /favicon.ico {
        return 204;
    }

    location / {
        error_page 503 /index.html;
        return 503;
    }

    location = /index.html {
        internal;
    }
}
