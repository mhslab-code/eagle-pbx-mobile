server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 10.20.20.148 mobile-dev;

    root /srv/eagle-pbx-mobile-builds;
    index index.html;

    allow 10.20.20.0/24;
    allow 127.0.0.1;
    deny all;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.apk$ {
        default_type application/vnd.android.package-archive;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
}
